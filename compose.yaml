services:
  souls:
    build: .
    container_name: souls
    restart: unless-stopped
    init: true
    environment:
      SITES_RUNTIME_ROOT: /app/.wrangler/runtime
    volumes:
      - souls-data:/app/.wrangler
    tmpfs:
      - /app/dist/server/.wrangler:uid=1000,gid=1000,mode=0700
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get('https://127.0.0.1:8787',{rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
  cendres-owlbear:
    image: nginx:stable-alpine
    container_name: cendres-owlbear
    restart: unless-stopped
    volumes:
      - ./deploy/owlbear-redirect.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy-network
volumes:
  souls-data:
networks:
  proxy-network:
    external: true
