server {
    listen 80;
    server_name _;
    add_header Access-Control-Allow-Origin "https://www.owlbear.rodeo" always;
    # Fetch changes the request origin after a cross-origin redirect. Serve the
    # public manifest through this compatibility host instead of redirecting it.
    location = /manifest.json {
        proxy_pass https://souls.sunitro.de/owlbear/manifest.json;
        proxy_set_header Host souls.sunitro.de;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_hide_header Access-Control-Allow-Origin;
    }
    location = /background.html { return 302 https://souls.sunitro.de/owlbear/background$is_args$args; }
    location = /icon.svg { return 302 https://souls.sunitro.de/owlbear/character.svg; }
    location = / { return 302 https://souls.sunitro.de/owlbear$is_args$args; }
    location / { return 302 https://souls.sunitro.de$request_uri; }
}
